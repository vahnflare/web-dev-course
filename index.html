    <title>Web Development Course Dashboard</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f4;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            text-align: center;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            text-decoration: none;
            color: #007acc;
            font-weight: bold;
            border: 1px solid #ddd;
            transition: background 0.2s, color 0.2s;
        }

        .card:hover {
            background-color: #007acc;
            color: white;
        }
    </style>
</head>
